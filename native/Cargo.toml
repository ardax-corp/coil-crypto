[package]
name = "crypto"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "coil-crypto native cdylib (RustCrypto, C ABI coil_crypto_*)"
publish = false

[lib]
name = "crypto"
crate-type = ["cdylib", "rlib"]

[dependencies]
sha2 = "0.11.0"
blake3 = "1.8.5"
hmac = "0.13.0"
chacha20poly1305 = "0.11.0"
aes-gcm = "0.11.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
argon2 = "0.5.3"
getrandom = "0.4.3"
zeroize = "1.9.0"
subtle = "2.6.1"
